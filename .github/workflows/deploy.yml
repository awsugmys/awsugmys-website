name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:00 IST (18:30 UTC) daily: moves finished events from Upcoming to Past.
    - cron: "30 18 * * *"
  workflow_dispatch:

# OIDC needs id-token: write; contents: read to check out the code.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Skip until the deploy role variable is set (e.g. on forks).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload fingerprinted assets (cached one year)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      - name: Upload pages (revalidated) and remove stale files
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete --no-progress

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
