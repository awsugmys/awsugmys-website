name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:00 IST (18:30 UTC) daily: moves finished events from Upcoming to Past.
    - cron: "30 18 * * *"
  workflow_dispatch:

# OIDC needs id-token: write; contents: write lets the daily run commit newly
# imported Meetup events back to the repo.
permissions:
  id-token: write
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Skip until the deploy role variable is set (e.g. on forks).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Pull the latest events from the Meetup iCal feed into the events
      # collection. Only the daily cron and manual runs import; a plain push
      # deploys exactly what was pushed.
      - name: Import Meetup events
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run import:meetup

      # Commit any new/updated events back to main. [skip ci] stops this push
      # from starting a second deploy; the current run still builds and ships
      # the imported content below.
      - name: Commit imported events
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain src/content/events)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/events
            git commit -m "Import Meetup events [skip ci]"
            git push origin HEAD:main
          else
            echo "No event changes to commit."
          fi

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload fingerprinted assets (cached one year)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      - name: Upload pages (revalidated) and remove stale files
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete --no-progress

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
